<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청년 인구 소실과 문화 인프라 분석 보고서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #fff5fc; color: #86626e; font-family: 'Noto Sans KR', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .fade-img { transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- 헤더: 타이틀 겹침 방지를 위해 flex-col과 p-8(패딩) 적용 -->
    <header class="w-full bg-gradient-to-br from-[#defffc] via-[#e2e4f6] to-[#e7c8dd] py-12 px-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
            <span class="inline-block py-1 px-3 rounded-full bg-[#86626e] text-white text-xs font-bold mb-3">DATA ANALYSIS REPORT</span>
            <h1 class="text-3xl md:text-5xl font-black text-[#86626e] mb-4">
                지방 청년 소실, <br class="md:hidden">
                <span class="text-white bg-[#86626e] px-2 rounded">‘문화 인프라’</span>에서 답을 찾다
            </h1>
            <p class="text-sm md:text-lg text-[#86626e] font-medium">일자리 너머, 데이터로 증명하는 정주 여건의 중요성</p>
        </div>
    </header>

    <main class="w-full max-w-5xl px-6 py-12 flex flex-col gap-12">
        
        <!-- 지도 섹션 -->
        <section class="glass-card p-6 rounded-2xl shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-center">🗺️ 지역별 현황 지도 비교</h2>
            <div class="flex justify-center gap-2 mb-6 flex-wrap">
                <button onclick="changeMap('pop')" class="px-4 py-2 bg-[#86626e] text-white rounded-lg text-sm">인구 분포</button>
                <button onclick="changeMap('jobs')" class="px-4 py-2 bg-[#d8afc1] text-white rounded-lg text-sm">일자리 수</button>
                <button onclick="changeMap('culture')" class="px-4 py-2 bg-[#86626e] text-white rounded-lg text-sm">문화시설</button>
            </div>
            <div class="w-full flex justify-center bg-white p-2 rounded-xl border border-[#d8afc1]">
                <img id="map-image" src="인구 지도.png" alt="지도" class="max-w-full h-auto rounded-lg fade-img">
            </div>
        </section>

    </main>

    <script>
        // 이미지 전환 함수
        function changeMap(type) {
            const img = document.getElementById('map-image');
            img.style.opacity = 0;
            setTimeout(() => {
                if(type === 'pop') img.src = '인구 지도.png';
                if(type === 'jobs') img.src = '일자리 지도.png';
                if(type === 'culture') img.src = '문화교육시설 지도.png';
                img.style.opacity = 1;
            }, 400);
        }
    </script>
</body>
</html>
